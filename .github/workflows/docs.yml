name: docs

# The HTML docs site (MkDocs Material, config in mkdocs.yml).
# - Every PR: strict build. Broken links or anchors, or a page missing from the nav, fail it.
# - Every push to main (each feature, bug fix and release merge): build and deploy to
#   GitHub Pages at https://sethstenzel.github.io/manim-stage/.
# - Releases attach their own copy of the site (release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # --only-group: the docs tools only, without building Manim and its system libraries.
      - run: uv run --locked --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
