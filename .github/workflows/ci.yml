name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for pycairo/manimpango and Qt offscreen (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: System libraries for pycairo/manimpango (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --locked
      - run: uv run pytest

  package:
    # Build the wheel, check its contents, install it into a clean venv with the pinned
    # Manim and the studio extra, and run the console script (backlog 1.6).
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: python3 scripts/check_wheel.py dist/*.whl
      - name: Install the wheel into a clean environment
        run: |
          COMMIT=$(python3 -c "import json; print(json.load(open('upstreams.json'))['upstreams']['manim']['pinned']['commit'])")
          uv venv /tmp/clean --python 3.12
          WHEEL=$(ls dist/*.whl)
          uv pip install --python /tmp/clean "${WHEEL}[studio]" "manim @ git+https://github.com/ManimCommunity/manim@${COMMIT}"
      - name: Smoke-test the installed console script
        run: |
          /tmp/clean/bin/manim-stage --version
          /tmp/clean/bin/manim-stage doctor
          /tmp/clean/bin/manim-stage scenes tests/scenes/golden.py
          /tmp/clean/bin/manim-stage timeline tests/scenes/golden.py Shapes
          /tmp/clean/bin/python -c "from manim_stage.studio.ui.main_window import MainWindow; print('editor imports OK')"
