name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for pycairo/manimpango and Qt offscreen (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: System libraries for pycairo/manimpango (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --locked
      - run: uv run pytest

  package:
    # Build the wheel once, check its contents, then install it into a clean venv on
    # every OS with the pinned Manim and the studio extra, and smoke-test the console
    # script and the editor import (cross-platform release packaging, M4 gate).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv run --no-project python scripts/check_wheel.py dist/*.whl
      - name: Install the wheel into a clean environment
        run: |
          COMMIT=$(uv run --no-project python -c "import json; print(json.load(open('upstreams.json'))['upstreams']['manim']['pinned']['commit'])")
          uv venv clean-env --python 3.12
          WHEEL=$(ls dist/*.whl)
          uv pip install --python clean-env "${WHEEL}[studio]" "manim @ git+https://github.com/ManimCommunity/manim@${COMMIT}"
      - name: Smoke-test the installed console script and editor
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=clean-env/Scripts; else BIN=clean-env/bin; fi
          "$BIN/manim-stage" --version
          "$BIN/manim-stage" doctor
          "$BIN/manim-stage" scenes tests/scenes/golden.py
          "$BIN/manim-stage" timeline tests/scenes/golden.py Shapes
          "$BIN/manim-stage" catalog circle --kind mobjects
          "$BIN/python" -c "from manim_stage.studio.ui.main_window import MainWindow; print('editor imports OK')"
